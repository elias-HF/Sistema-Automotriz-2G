# Configuración base de la aplicación
spring.application.name = 2gautomotriz
server.port= 8086

# Configuración de H2 para entorno de desarrollo
spring.datasource.url = jdbc:h2:mem:automotrizdb
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

# JPA / persistencia
spring.jpa.hibernate.ddl-auto = none
spring.jpa.show-sql = true

# Inicializar schema.sql con datos base
spring.sql.init.mode = always

# Consola de H2 habilitada para depuración local
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console
spring.h2.console.settings.web-allow-others=true
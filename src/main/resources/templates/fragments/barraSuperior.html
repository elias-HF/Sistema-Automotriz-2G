<header th:fragment="barraSuperior" xmlns:th="http://www.thymeleaf.org" class="topbar d-flex align-items-center justify-content-between px-3">
    <div class="d-flex align-items-center gap-3">
        <button class="btn text-white fs-3 p-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-label="Mostrar u ocultar menú">
            <i class="bi bi-list"></i>
        </button>

        <a th:href="@{/dashboard}" class="brand-logo" aria-label="2G Automotriz - Inicio">
            <img th:src="@{/img/logo-azul.jpg}" src="/img/logo-azul.jpg" alt="Logo de 2G Automotriz" class="topbar-logo">
        </a>
    </div>

    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light rounded-circle info-button" type="button" title="Información del sistema" data-bs-toggle="modal" data-bs-target="#infoModal">
            <i class="bi bi-info-lg"></i>
        </button>

        <div class="topbar-divider"></div>

        <button class="profile-button d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="text-end">
                <strong th:text="${usuario ?: 'Administrador'}">Administrador</strong>
                <small>Administrador</small>
            </span>
            <i class="bi bi-person-circle fs-3"></i>
            <i class="bi bi-gear-fill"></i>
        </button>

        <div class="dropdown-menu dropdown-menu-end">
            <a class="dropdown-item" th:href="@{/administracion}">
                <i class="bi bi-gear me-2"></i>Administración
            </a>
            <a class="dropdown-item" th:href="@{/login}">
                <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
            </a>
        </div>
    </div>

    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="infoModalLabel">Acerca del sistema</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Sistema de gestión de reparaciones de 2G Automotriz.
                    <br>Versión 1.0.0
                </div>
            </div>
        </div>
    </div>
</header>


<div th:fragment="tabla" class="admin-tabla-clientes">

    <!-- BARRA DE HERRAMIENTAS -->
    <div class="admin-tabla-toolbar">

        <div class="input-group admin-buscador-clientes">
            <input type="search" id="buscarClienteDemo" class="form-control" placeholder="Buscar por nombre, teléfono o DNI..." aria-label="Buscar clientes">
            <button class="btn btn-secondary" type="button" id="btnBuscarClienteDemo" aria-label="Buscar">
                <i class="bi bi-search"></i>
            </button>
        </div>

        <button type="button" class="btn btn-success admin-btn-registrar" data-bs-toggle="modal" data-bs-target="#modalRegistrarCliente">
            <i class="bi bi-plus-lg"></i>
            REGISTRAR CLIENTE
        </button>

    </div>

    <!-- TABLA -->
    <div class="table-responsive">
        <table class="table table-hover align-middle admin-clientes-table">

            <thead>
            <tr>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Correo electrónico</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody id="tablaClientesDemo">
            <tr th:each="cliente : ${clientes}">
                <td>
                    <div class="d-flex flex-column">
                        <span class="fw-semibold" th:text="${cliente.nombre}"></span>
                        <small class="text-muted" th:text="|Código: ${cliente.codigo}|"></small>
                    </div>
                </td>
                <td th:text="${cliente.dni}"></td>
                <td th:text="${cliente.telefono}"></td>
                <td th:text="${cliente.correo}"></td>

                <td class="text-center">
                    <button type="button"
                            class="btn btn-sm btn-warning"
                            title="Modificar"
                            data-bs-toggle="modal"
                            data-bs-target="#modalEditarCliente"
                            th:data-id="${cliente.idCliente}">
                        <i class="bi bi-pencil-square"></i>
                    </button>

                    <button type="button"
                            class="btn btn-sm btn-danger"
                            title="Desactivar"
                            data-bs-toggle="modal"
                            data-bs-target="#modalDesactivarCliente"
                            th:data-id="${cliente.idCliente}"
                            th:data-nombre="${cliente.nombre}">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </td>
            </tr>

            <tr id="clientesSinResultados" hidden>
                <td colspan="5" class="text-center">
                    No se encontraron clientes.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- PIE Y PAGINACIÓN -->
    <div class="admin-tabla-footer">
        <span id="contadorClientesDemo">Mostrando 1 a 4 de 8 clientes</span>
        <nav class="admin-paginacion" aria-label="Paginación de clientes">
            <button type="button" class="admin-pagina-btn" id="clientesAnterior">Anterior</button>
            <div id="numerosPaginasClientes" class="admin-pagina-numeros"></div>
            <button type="button" class="admin-pagina-btn" id="clientesSiguiente">Siguiente</button>
        </nav>
    </div>

    <!-- MODALES -->
    <div class="modal fade" id="modalRegistrarCliente" tabindex="-1" aria-labelledby="tituloModalRegistrar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalRegistrar">Registrar nuevo cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/clientes/registrar}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" name="nombre" placeholder="Ingrese el nombre completo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control" name="dni" placeholder="Ingrese el DNI" maxlength="8" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" name="telefono" placeholder="Ingrese el teléfono" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" name="correo" placeholder="Ingrese el correo electrónico" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-lg"></i>
                            Registrar cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="tituloModalEditar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalEditar">Modificar cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/clientes/modificar}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="idCliente">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control" name="dni" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" name="telefono" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" name="correo" required>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDesactivarCliente" tabindex="-1" aria-labelledby="tituloModalDesactivar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalDesactivar">Desactivar cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/clientes/desactivar}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="desactivarIdCliente">
                        <div class="text-center mb-3"><i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i></div>
                        <p class="text-center mb-2">¿Estás seguro de que deseas desactivar al cliente?</p>
                        <h6 class="text-center fw-bold" id="desactivarNombreCliente"></h6>
                        <p class="text-muted text-center small mt-3 mb-0">El cliente dejará de estar disponible en los registros activos.</p>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger"><i class="bi bi-x-circle"></i>Sí, desactivar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:fragment="tablaVehiculo" class="admin-tabla-vehiculos">

    <!-- BARRA DE HERRAMIENTAS -->
    <div class="admin-tabla-toolbar">
        <div class="input-group admin-buscador-vehiculos">
            <input type="search" id="buscarVehiculo" class="form-control"
                   placeholder="Buscar por placa, marca, modelo o propietario..."
                   aria-label="Buscar vehículos">
            <button type="button" class="btn btn-secondary" id="btnBuscarVehiculo" aria-label="Buscar">
                <i class="bi bi-search"></i>
            </button>
        </div>

        <button type="button" class="btn btn-success admin-btn-registrar"
                data-bs-toggle="modal" data-bs-target="#modalRegistrarVehiculo">
            <i class="bi bi-plus-lg"></i>
            REGISTRAR VEHÍCULO
        </button>
    </div>

    <!-- TABLA -->
    <div class="table-responsive">
        <table class="table table-hover align-middle admin-vehiculos-table">
            <thead>
            <tr>
                <th>Vehículo</th>
                <th>Placa</th>
                <th>Año</th>
                <th>Kilometraje</th>
                <th>Propietario</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody id="tablaVehiculos">
            <tr th:each="vehiculo : ${vehiculos}">
                <td>
                    <div class="vehiculo-info">
                        <span class="vehiculo-avatar"><i class="bi bi-car-front-fill"></i></span>
                        <div>
                            <strong th:text="${vehiculo.marca + ' ' + vehiculo.modelo}"></strong>
                            <small th:text="|ID: ${vehiculo.codigo}|"></small>
                        </div>
                    </div>
                </td>
                <td><span class="vehiculo-placa" th:text="${vehiculo.placa}"></span></td>
                <td th:text="${vehiculo.anioFabricacion}"></td>
                <td th:text="${#numbers.formatDecimal(vehiculo.kilometros, 1, 'COMMA', 0, 'POINT')} + ' km'"></td>
                <td th:text="${vehiculo.nombreCliente}"></td>
                <td>
                    <span class="vehiculo-estado"
                          th:classappend="${vehiculo.activo} ? 'estado-activo' : 'estado-inactivo'"
                          th:text="${vehiculo.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                </td>
                <td class="text-center text-nowrap">
                    <button type="button" class="btn btn-sm btn-warning" title="Modificar"
                            th:if="${vehiculo.activo}"
                            data-bs-toggle="modal" data-bs-target="#modalEditarVehiculo"
                            th:data-id="${vehiculo.idVehiculo}">
                        <i class="bi bi-pencil-square"></i>
                    </button>

                    <button type="button" class="btn btn-sm btn-danger" title="Desactivar"
                            th:if="${vehiculo.activo}"
                            data-bs-toggle="modal" data-bs-target="#modalDesactivarVehiculo"
                            th:data-id="${vehiculo.idVehiculo}"
                            th:data-nombre="${vehiculo.marca + ' ' + vehiculo.modelo + ' ' + vehiculo.placa}">
                        <i class="bi bi-x-circle"></i>
                    </button>

                    <form th:unless="${vehiculo.activo}" th:action="@{/vehiculos/activar}"
                          method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${vehiculo.idVehiculo}">
                        <button type="submit" class="btn btn-sm btn-success" title="Activar">
                            <i class="bi bi-check-lg"></i>
                        </button>
                    </form>
                </td>
            </tr>

            <tr id="vehiculosSinResultados" hidden>
                <td colspan="7" class="text-center">No se encontraron vehículos.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- PIE Y PAGINACIÓN -->
    <div class="admin-tabla-footer">
        <span id="contadorVehiculos"></span>
        <nav class="admin-paginacion" aria-label="Paginación de vehículos">
            <button type="button" class="admin-pagina-btn" id="vehiculosAnterior">Anterior</button>
            <div id="numerosPaginasVehiculos" class="admin-pagina-numeros"></div>
            <button type="button" class="admin-pagina-btn" id="vehiculosSiguiente">Siguiente</button>
        </nav>
    </div>

    <!-- MODAL REGISTRAR -->
    <div class="modal fade" id="modalRegistrarVehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar nuevo vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/vehiculos/registrar}" method="post">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" name="marca" maxlength="25" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" name="modelo" maxlength="25" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Placa</label>
                                <input type="text" class="form-control" name="placa" placeholder="ABC-123"
                                       maxlength="7" pattern="[A-Z]{3}-[0-9]{3}" title="Formato: ABC-123" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Año de fabricación</label>
                                <input type="number" class="form-control" name="anioFabricacion"
                                       min="1900" step="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Kilometraje</label>
                                <input type="number" class="form-control" name="kilometros"
                                       min="0" step="0.01" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Propietario</label>
                                <select class="form-select" name="idCliente" required>
                                    <option value="">Selecciona un cliente</option>
                                    <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                                            th:text="|${c.nombre} - DNI ${c.dni}|"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-lg"></i> Registrar vehículo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditarVehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modificar vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/vehiculos/modificar}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="idVehiculo">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" name="marca" maxlength="25" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" name="modelo" maxlength="25" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Placa</label>
                                <input type="text" class="form-control" name="placa" placeholder="ABC-123"
                                       maxlength="7" pattern="[A-Z]{3}-[0-9]{3}" title="Formato: ABC-123" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Año de fabricación</label>
                                <input type="number" class="form-control" name="anioFabricacion"
                                       min="1900" step="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Kilometraje</label>
                                <input type="number" class="form-control" name="kilometros"
                                       min="0" step="0.01" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Propietario</label>
                                <select class="form-select" name="idCliente" required>
                                    <option value="">Selecciona un cliente</option>
                                    <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                                            th:text="|${c.nombre} - DNI ${c.dni}|"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DESACTIVAR -->
    <div class="modal fade" id="modalDesactivarVehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Desactivar vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form th:action="@{/vehiculos/desactivar}" method="post">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="desactivarIdVehiculo">
                        <div class="text-center mb-3">
                            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                        </div>
                        <p class="text-center mb-2">¿Estás seguro de que deseas desactivar el vehículo?</p>
                        <h6 class="text-center fw-bold" id="desactivarNombreVehiculo"></h6>
                        <p class="text-muted text-center small mt-3 mb-0">
                            El vehículo dejará de estar disponible. Podrás reactivarlo después.
                        </p>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-x-circle"></i> Sí, desactivar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión 2G Automotriz">
    <title>2G Automotriz</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/citas.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/comprobante.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/ordenes.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
    <link rel="stylesheet" th:href="@{/css/almacen.css}">
</head>


<body>

<div th:replace="~{fragments/toast :: toast}"></div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('toastApp');
        if (el) new bootstrap.Toast(el, { delay: 5000 }).show();
    });
</script>

<header th:replace="~{fragments/barraSuperior :: barraSuperior}"></header>

<div class="main-container">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- Contenido central dinámico en Index.html -->
    <main class="content">
        <th:block th:switch="${vista}">

            <th:block th:case="'citas'">
                <div th:replace="~{fragments/citas :: content}"></div>
            </th:block>

            <th:block th:case="'ordenes'">
                <div th:replace="~{fragments/ordenes :: content}"></div>
            </th:block>

            <th:block th:case="'comprobante'">
                <div th:replace="~{fragments/comprobante :: content}"></div>
            </th:block>

            <th:block th:case="'almacen'">
                <div th:replace="~{fragments/almacen :: content}"></div>
            </th:block>

            <th:block th:case="'administracion'">
                <div th:replace="~{fragments/administracion :: content}"></div>
            </th:block>

            <!-- Dashboard predeterminado: siempre al final -->
            <th:block th:case="*">
                <div th:replace="~{fragments/dashboard :: content}"></div>
            </th:block>

        </th:block>
    </main>
</div>

<!-- Pie de página -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('toastApp');
        if (el) new bootstrap.Toast(el, { delay: 5000 }).show();
    });
</script>

<script th:src="@{/js/tabla-admin.js}"></script>
<script th:src="@{/js/cliente.js}"></script>
<script th:src="@{/js/empleado.js}"></script>
<script th:src="@{/js/vehiculo.js}"></script>
<script th:src="@{/js/servicio.js}"></script>
<script th:src="@{/js/articulo.js}"></script>
<script th:src="@{/js/orden.js}"></script>

<!-- Chart para dashboard -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const categorias = /*[[${categorias}]]*/ [];
        const ingresos = /*[[${ingresosPorCategoria}]]*/ [];
        const estadosOrden = /*[[${estadosOrden}]]*/ [];
        const cantidadesOrden = /*[[${cantidadesOrden}]]*/ [];
        const dias = /*[[${diasSemana}]]*/ [];
        const citasPorDia = /*[[${citasPorDia}]]*/ [];
        const ordenesPorDia = /*[[${ordenesPorDia}]]*/ [];

        // 1. Ingresos por categoría
        const ctxIngresos = document.getElementById('ingresosChart');
        if (ctxIngresos) {
            new Chart(ctxIngresos, {
                type: 'bar',
                data: {
                    labels: categorias,
                    datasets: [{
                        label: 'Ingresos (S/)',
                        data: ingresos,
                        backgroundColor: ['#f5a623', '#164b78', '#426b9c', '#e9b15a', '#a8c8e8', '#13b886', '#6c757d'],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true },
                        x: { ticks: { maxRotation: 0, minRotation: 0 } }
                    }
                }
            });
        }

        // 2. Estado de las órdenes
        const ctxOrdenes = document.getElementById('ordenesChart');
        if (ctxOrdenes) {
            new Chart(ctxOrdenes, {
                type: 'doughnut',
                data: {
                    labels: estadosOrden,
                    datasets: [{
                        data: cantidadesOrden,
                        backgroundColor: ['#13b886', '#f5a623', '#dc3545']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // 3. Actividad por día de la semana
        const ctxActividad = document.getElementById('actividadChart');
        if (ctxActividad) {
            new Chart(ctxActividad, {
                type: 'line',
                data: {
                    labels: dias,
                    datasets: [
                        {
                            label: 'Citas',
                            data: citasPorDia,
                            borderColor: '#164b78',
                            backgroundColor: '#164b78',
                            tension: 0.3
                        },
                        {
                            label: 'Órdenes',
                            data: ordenesPorDia,
                            borderColor: '#efc278',
                            backgroundColor: '#f5a623',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }
    });
</script>

<!-- FullCalendar (solo lo usa la pestaña de citas) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales-all.global.min.js"></script>
<script th:src="@{/js/cita.js}"></script>
</body>
</html>

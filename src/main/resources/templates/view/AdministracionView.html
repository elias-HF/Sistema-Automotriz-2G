<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administración - 2G Automotriz</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>

    <body>
        <div class="container-fluid p-4">
            <h1>ADMINISTRACIÓN GENERAL</h1>
            <p>Administra la información general, usuarios y catálogos del taller.</p>
            <hr class="border-dark opacity-100">

            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='empleados' )}" class="btn btn-outline-primary w-100"><i class="bi bi-person-badge"></i>EMPLEADO</a>
                </div>

                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='clientes' )}" class="btn btn-outline-primary w-100"><i class="bi bi-people"></i>CLIENTE</a>
                </div>

                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='vehiculos' )}" class="btn btn-outline-primary w-100"><i class="bi bi-car-front"></i>VEHÍCULO</a>
                </div>

                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='servicios' )}" class="btn btn-outline-primary w-100"><i class="bi bi-tools"></i>SERVICIO</a>
                </div>

                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='comprobantes' )}" class="btn btn-outline-primary w-100"><i class="bi bi-receipt"></i>COMPROBANTE</a>
                </div>

                <div class="col-6 col-lg-2">
                    <a th:href="@{/administracion( elemento='categorias' )}" class="btn btn-outline-primary w-100"><i class="bi bi-tags"></i>CATEGORÍA</a>
                </div>
            </div>

            <section class="bg-white rounded shadow-sm p-3">
                <h2 th:text="'LISTA DE ' + ${elemento}">LISTA DE CLIENTES</h2>
                <div th:if="${elemento == 'clientes'}" th:replace="~{fragments/administracion/tablaCliente :: tabla}"></div>
                <div th:if="${elemento == 'vehiculos'}"> <!-- Aquí se insertará el fragment de vehículos --> </div>
                <div th:if="${elemento == 'empleados'}"> <!-- Aquí se insertará el fragment de empleados --> </div>
            </section>

        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
